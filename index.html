<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Picker from Image</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>🎨 Image Color Picker</h2>

<input type="file" id="upload" accept="image/*">

<div class="container">
    <canvas id="canvas"></canvas>
</div>

<div id="colorBox"></div>
<div class="info" id="colorInfo">Pick a color from image</div>

<script src="script.js"></script>

</body>
</html>
